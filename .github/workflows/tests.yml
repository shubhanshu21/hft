name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - name: Lint (defects only, see pyproject.toml)
        run: ruff check .
      - name: Unit tests (includes the golden-record parity tests)
        run: python -m unittest discover -s tests
      - name: Golden replay (slow, ~1 min)
        run: RUN_REPLAY=1 python -m unittest tests.test_strategy_parity
